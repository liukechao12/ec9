<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title data-i18n="checkin_title">活动签到</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="header"></div>

  <div class="sheet">
    <div class="page-title" data-i18n="checkin_title">活动签到</div>

    <div class="form-row">
      <div class="form-label"><span data-i18n="phone">手机号：</span></div>
      <div class="form-field"><input class="input" id="cPhone" type="tel" maxlength="11" inputmode="numeric" data-i18n="phone_ph"></div>
    </div>
    <div class="form-row">
      <div class="form-label"><span data-i18n="code">验证码：</span></div>
      <div class="form-field">
        <input class="input" id="cCode" type="tel" maxlength="6" inputmode="numeric" data-i18n="code_ph">
        <button class="btn-code" id="btnCode" data-i18n="get_code">获取验证码</button>
      </div>
    </div>

    <button class="btn-primary" id="btnNext" data-i18n="next">下一步</button>
    <div class="error-pill hidden" id="errPill"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  var E = window.EC9;
  E.mountHeader(document.getElementById("header"), false);

  var eventId = E.param("event_id", E.DEFAULT_EVENT_ID);
  if (E.S.phone) document.getElementById("cPhone").value = E.S.phone;

  document.getElementById("btnCode").addEventListener("click", function () {
    var phone = document.getElementById("cPhone").value.trim();
    if (!/^1[3-9]\d{9}$/.test(phone)) { E.errPill(E.t("err_phone")); return; }
    E.Api.sendCode(phone).then(function () {
      E.codeCountdown(document.getElementById("btnCode"));
      E.toast(E.t("code_sent"));
    }).catch(function (e) { E.errPill(e.message); });
  });

  document.getElementById("btnNext").addEventListener("click", function () {
    var phone = document.getElementById("cPhone").value.trim();
    var code = document.getElementById("cCode").value.trim();
    if (!/^1[3-9]\d{9}$/.test(phone)) { E.errPill(E.t("err_phone")); return; }
    if (!code) { E.errPill(E.t("err_code")); return; }

    E.Api.verifyCode(phone, code).then(function (d) {
      E.S.token = d.verification_token || "";
      E.S.phone = phone;
      return E.Api.checkin(phone, Number(eventId));
    }).then(function () {
      E.go("result.html", { type: "checkin", status: "success", event_id: eventId });
    }).catch(function (e) {
      // 按后端错误码映射到签到状态页
      var s = "network";
      if (e.code === 404) s = "mismatch";
      else if (String(e.message || "").indexOf("重复") >= 0 || String(e.message || "").indexOf("已签到") >= 0) s = "repeat";
      E.go("result.html", { type: "checkin", status: s, event_id: eventId });
    });
  });
})();
</script>
</body>
</html>
