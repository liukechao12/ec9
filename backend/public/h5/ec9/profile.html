<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title data-i18n="profile_title">个人信息</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="header"></div>

  <div class="sheet">
    <div class="page-title" data-i18n="profile_title">个人信息</div>
    <div class="group-tip info" id="topTip"></div>
    <div class="required-note" data-i18n="required_note">* 为必填项</div>

    <div id="memberList"></div>
    <button class="add-member-btn" id="btnAddMember" data-i18n="add_member">＋ 添加填报人</button>

    <button class="btn-primary" id="btnSubmit" data-i18n="next">下一步</button>
    <div class="error-pill hidden" id="errPill"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  var E = window.EC9;
  E.mountHeader(document.getElementById("header"), false);

  var eventId = E.param("event_id", E.DEFAULT_EVENT_ID);
  var buyerPhone = E.S.phone;
  var sessions = [];
  var MAX = 10;

  if (!buyerPhone || !E.S.token) { E.go("signup.html", { event_id: eventId }); return; }

  /* ---------- 填报人卡片 ---------- */
  // members 内存态：{ id, name, phone, company, position, inviter, focus, session_id, session_all, is_invited }
  // 票种统一在下一页（ticket.html 门票类型）选择，本页不出现票种下拉
  var seq = 0;
  var members = [];

  /* ---------- 论坛多选 ----------
     一个人可以选任意多个论坛：只去上午、上午+一个下午、全去都行。
     「全部论坛」是快捷项：勾上 = 全勾；手动勾满也等价（session_all=1）。
     内存态：m.session_ids = [所选 id...]；m.session_all = 是否勾满 */
  function pickedIds(m) {
    if (Array.isArray(m.session_ids) && m.session_ids.length) return m.session_ids.slice();
    // 老草稿只有 session_id / session_all
    if (m.session_all) return sessions.map(function (s) { return s.id; });
    return Number(m.session_id) > 0 ? [Number(m.session_id)] : [];
  }

  function sessionPicksHtml(m) {
    var ids = pickedIds(m);
    var items = '<label class="sp-item sp-all"><input type="checkbox" class="f-sess-all"' +
      (ids.length > 0 && ids.length >= sessions.length && sessions.length > 0 ? " checked" : "") + '>' +
      '<span>' + E.esc(E.t("forum_all")) + '</span></label>';
    items += sessions.map(function (s) {
      return '<label class="sp-item"><input type="checkbox" class="f-sess" value="' + s.id + '"' +
        (ids.indexOf(s.id) > -1 ? " checked" : "") + '><span>' + E.esc(s.name) + '</span></label>';
    }).join("");
    return '<div class="sess-picks">' + items + '</div>';
  }

  function memberCardHtml(m, idx) {
    var isBuyer = idx === 0;
    return '<div class="member-card" data-mid="' + m.id + '">' +
      '<div class="mc-head">' +
        '<div><span class="mc-title">' + E.t("member_card").replace("{n}", idx + 1) + '</span>' +
          '<span class="mc-tag">' + E.t(isBuyer ? "buyer_tag" : "member_tag") + '</span></div>' +
        (isBuyer ? '' : '<button class="mc-remove" data-remove="' + m.id + '">' + E.t("remove_member") + '</button>') +
      '</div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="name">姓名：</span><span class="required-star">*</span></div>' +
        '<div class="form-field"><input class="input f-name" maxlength="100" data-i18n="name_ph" value="' + E.esc(m.name) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="phone">手机：</span><span class="required-star">*</span></div>' +
        '<div class="form-field"><input class="input f-phone" maxlength="11" data-i18n="phone_ph" value="' + E.esc(m.phone) + '"' + (isBuyer ? " readonly" : "") + '></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="company">公司：</span><span class="required-star">*</span></div>' +
        '<div class="form-field"><input class="input f-company" maxlength="200" data-i18n="company_ph" value="' + E.esc(m.company) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="job">职务：</span><span class="required-star">*</span></div>' +
        '<div class="form-field"><input class="input f-position" maxlength="100" data-i18n="job_ph" value="' + E.esc(m.position) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="inviter">邀请人：</span></div>' +
        '<div class="form-field"><input class="input f-inviter" maxlength="100" data-i18n="inviter_ph" value="' + E.esc(m.inviter) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="focus">关注方向：</span></div>' +
        '<div class="form-field"><input class="input f-focus" maxlength="200" data-i18n="focus_ph" value="' + E.esc(m.focus) + '"></div></div>' +
      '<div class="form-row form-row-col"><div class="form-label"><span data-i18n="forum">论坛：</span><span class="required-star">*</span></div>' +
        '<div class="form-field">' + sessionPicksHtml(m) + '</div></div>' +
      '<div class="invited-tip hidden"></div>' +
    '</div>';
  }

  /** 把卡片上的勾选同步回内存态 */
  function syncSessions(card, idx) {
    var m = members[idx];
    if (!m) return;
    var ids = [];
    Array.prototype.forEach.call(card.querySelectorAll(".f-sess"), function (b) {
      if (b.checked) ids.push(Number(b.value));
    });
    m.session_ids = ids;
    // 勾满 = 全部论坛（与快捷项等价）
    m.session_all = sessions.length > 0 && ids.length >= sessions.length;
    m.session_id = ids.length ? ids[0] : 0;   // 兼容回退：老字段只留第一个
    var allBox = card.querySelector(".f-sess-all");
    if (allBox) allBox.checked = !!m.session_all;
  }

  function render() {
    var box = document.getElementById("memberList");
    box.innerHTML = members.map(function (m, i) { return memberCardHtml(m, i); }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".member-card"), function (card, idx) {
      card.querySelector(".f-name").addEventListener("input", function () { members[idx].name = this.value; });
      card.querySelector(".f-phone").addEventListener("input", function () {
        if (idx === 0) { this.value = buyerPhone; E.toast(E.t("err_self_phone")); return; }
        members[idx].phone = this.value;
      });
      card.querySelector(".f-phone").addEventListener("change", function () { checkInvited(); });
      card.querySelector(".f-company").addEventListener("input", function () { members[idx].company = this.value; });
      card.querySelector(".f-position").addEventListener("input", function () { members[idx].position = this.value; });
      card.querySelector(".f-inviter").addEventListener("input", function () { members[idx].inviter = this.value; });
      card.querySelector(".f-focus").addEventListener("input", function () { members[idx].focus = this.value; });
      // 论坛多选：具体项变化时重算「是否勾满」；勾满即等价「全部论坛」
      Array.prototype.forEach.call(card.querySelectorAll(".f-sess"), function (box) {
        box.addEventListener("change", function () { syncSessions(card, idx); });
      });
      // 「全部论坛」快捷项：勾上全勾、取消全消
      var allBox = card.querySelector(".f-sess-all");
      if (allBox) {
        allBox.addEventListener("change", function () {
          var on = this.checked;
          Array.prototype.forEach.call(card.querySelectorAll(".f-sess"), function (b) { b.checked = on; });
          syncSessions(card, idx);
        });
      }
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-remove]"), function (btn) {
      btn.addEventListener("click", function () {
        var mid = Number(btn.getAttribute("data-remove"));
        members = members.filter(function (m) { return m.id !== mid; });
        render();
      });
    });
    document.getElementById("btnAddMember").style.display = members.length >= MAX ? "none" : "";
    renderInvitedTips();
    E.applyLang();
  }

  /* 邀约名单：命中的人 = 免票 + 免审核 + 提交即报名成功；没命中的 = 需审核后购票付款。
     这里只是给用户的即时反馈，后端提交时会按同样口径再判一次。 */
  var invitedSet = {}, needPaySet = {}, giftSet = {}, giftNameSet = {};
  // 免费口径（同后端）：有赠票 → 选那张票免费；管理员特批免票 → 全免
  function isFreeOf(m) {
    if (!m) return false;
    if (Number(m.gift_ticket_id) > 0) return true;      // 会默认帮他选中赠票
    return !!(m.is_invited && m.need_pay !== true);
  }
  function giftNameOf(m) { return (m && m.gift_ticket_name) || ""; }

  function checkInvited() {
    var phones = members.map(function (x) { return x.phone; }).filter(function (p) { return /^1[3-9]\d{9}$/.test(p); });
    if (!phones.length) { renderInvitedTips(); return; }
    E.Api.checkInvited(phones, Number(eventId)).then(function (d) {
      invitedSet = (d && d.invited) || {};
      needPaySet = (d && d.need_pay) || {};
      giftSet = (d && d.ticket_type) || {};          // 邀约管理给这个人指定的赠票票种 id
      giftNameSet = (d && d.ticket_name) || {};
      members.forEach(function (m) {
        m.is_invited = !!invitedSet[m.phone];
        // 邀约名单内：指定了赠票 → 选它免费；没指定 → 照所选票种付费
        m.need_pay = m.is_invited ? (needPaySet[m.phone] !== false) : true;
        m.gift_ticket_id = Number(giftSet[m.phone]) || 0;
        m.gift_ticket_name = giftNameSet[m.phone] || "";
      });
      renderInvitedTips();
    }).catch(function () { /* 查询失败不阻塞填写，后端提交时会再判一次 */ });
  }

  function renderInvitedTips() {
    var box = document.getElementById("memberList");
    Array.prototype.forEach.call(box.querySelectorAll(".member-card"), function (card, i) {
      var m = members[i];
      if (!m) return;
      var tip = card.querySelector(".invited-tip");
      // 结果标签单独加一个，避免覆盖「购票人·本人 / 同行人」身份标签
      var head = card.querySelector(".mc-head > div");
      var tag = card.querySelector(".mc-tag-result");
      if (!tag && head) {
        tag = document.createElement("span");
        tag.className = "mc-tag mc-tag-result";
        head.appendChild(tag);
      }
      if (Number(m.gift_ticket_id) > 0) {
        // 邀约管理给他指定了票：选那张免费，选别的照价
        if (tip) { tip.textContent = E.t("gift_ticket_tip").replace("{ticket}", giftNameOf(m)); tip.classList.remove("hidden"); }
        if (tag) tag.textContent = E.t("gift_tag");
      } else if (isFreeOf(m)) {
        if (tip) { tip.textContent = E.t("invited_tip"); tip.classList.remove("hidden"); }
        if (tag) tag.textContent = E.t("invited_tag");
      } else if (m.is_invited) {
        // 管理员特批：邀约嘉宾也要买票
        if (tip) { tip.textContent = E.t("invited_tip_pay"); tip.classList.remove("hidden"); }
        if (tag) tag.textContent = E.t("invited_tag_pay");
      } else {
        if (tip) { tip.textContent = E.t("need_buy_tip"); tip.classList.remove("hidden"); }
        if (tag) tag.textContent = E.t("need_buy_tag");
      }
    });
    renderSummary();
  }

  /* 顶部汇总：这单里谁直接报名成功、谁要购票，人数对得上 */
  function renderSummary() {
    var box = document.getElementById("topTip");
    if (!box) return;
    if (!members.length) { box.textContent = ""; return; }
    var free = members.filter(isFreeOf).length;
    var pay = members.length - free;
    box.className = "group-tip " + (pay ? "info" : "ok");
    box.textContent = E.t("profile_summary")
      .replace("{n}", members.length)
      .replace("{ok}", free)
      .replace("{pay}", pay);
  }

  document.getElementById("btnAddMember").addEventListener("click", function () {
    if (members.length >= MAX) { E.toast(E.t("err_max_member")); return; }
    members.push({ id: ++seq, name: "", phone: "", company: "", position: "", inviter: members[0] ? members[0].inviter : "", focus: "", session_ids: [], session_id: 0, session_all: false });
    render();
  });

  /* ---------- 加载场次 ---------- */
  E.Api.event(eventId).then(function (ev) {
    var e = ev.event || ev;
    sessions = ev.sessions || e.sessions || [];
    members.push({ id: ++seq, name: (E.S.data && E.S.data.name) || "", phone: buyerPhone, company: (E.S.data && E.S.data.company) || "", position: (E.S.data && E.S.data.position) || "", inviter: "", focus: (E.S.data && E.S.data.focus) || "", session_ids: [], session_id: 0, session_all: false });
    render();
    checkInvited();
  }).catch(function (e) { E.errPill(e.message || E.t("err_profile_load")); });

  /* ---------- 下一步：校验后进入门票类型页 ---------- */
  document.getElementById("btnSubmit").addEventListener("click", function () {
    E.errPill("");
    for (var i = 0; i < members.length; i++) {
      var m = members[i];
      if (!String(m.name).trim() || !String(m.company).trim() || !String(m.position).trim()) {
        E.errPill(E.t("err_required")); return;
      }
      // 论坛至少选一个（多选）
      if (!pickedIds(m).length) {
        E.errPill(E.t("err_required")); return;
      }
      if (!/^1[3-9]\d{9}$/.test(String(m.phone))) { E.errPill(E.t("err_phone_bad")); return; }
    }
    var seen = {};
    for (var j = 0; j < members.length; j++) {
      if (seen[members[j].phone]) { E.errPill(E.t("err_dup_phone")); return; }
      seen[members[j].phone] = true;
    }
    // 暂存填报人，票种在 ticket.html 选择后统一提交
    E.S.patch({ draft_members: members });
    E.go("ticket.html", { event_id: eventId });
  });
})();
</script>
</body>
</html>
