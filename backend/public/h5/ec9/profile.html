<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title data-i18n="profile_title">个人信息</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="header"></div>

  <div class="sheet">
    <div class="page-title" data-i18n="profile_title">个人信息</div>
    <div class="group-tip info" id="topTip" data-i18n="buyer_pay_tip">你是购票人，请完成本单支付</div>

    <div id="memberList"></div>
    <button class="add-member-btn" id="btnAddMember" data-i18n="add_member">＋ 添加填报人</button>

    <button class="btn-primary" id="btnSubmit" data-i18n="next">下一步</button>
    <div class="error-pill hidden" id="errPill"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  var E = window.EC9;
  E.mountHeader(document.getElementById("header"), false);

  var eventId = E.param("event_id", E.DEFAULT_EVENT_ID);
  var buyerPhone = E.S.phone;
  var sessions = [];
  var MAX = 10;

  if (!buyerPhone || !E.S.token) { E.go("signup.html", { event_id: eventId }); return; }

  /* ---------- 填报人卡片 ---------- */
  // members 内存态：{ id, name, phone, company, position, inviter, focus, session_id, is_invited }
  // 票种统一在下一页（ticket.html 门票类型）选择，本页不出现票种下拉
  var seq = 0;
  var members = [];

  function memberCardHtml(m, idx) {
    var isBuyer = idx === 0;
    var sessOpts = '<option value="">' + E.esc(E.t("forum_ph")) + '</option>' +
      sessions.map(function (s) {
        return '<option value="' + s.id + '"' + (Number(m.session_id) === s.id ? " selected" : "") + '>' + E.esc(s.name) + '</option>';
      }).join("");
    return '<div class="member-card" data-mid="' + m.id + '">' +
      '<div class="mc-head">' +
        '<div><span class="mc-title">' + E.t("member_card").replace("{n}", idx + 1) + '</span>' +
          '<span class="mc-tag">' + E.t(isBuyer ? "buyer_tag" : "member_tag") + '</span></div>' +
        (isBuyer ? '' : '<button class="mc-remove" data-remove="' + m.id + '">' + E.t("remove_member") + '</button>') +
      '</div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="name">姓名：</span></div>' +
        '<div class="form-field"><input class="input f-name" maxlength="100" data-i18n="name_ph" value="' + E.esc(m.name) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="phone">手机：</span></div>' +
        '<div class="form-field"><input class="input f-phone" maxlength="11" data-i18n="phone_ph" value="' + E.esc(m.phone) + '"' + (isBuyer ? " readonly" : "") + '></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="company">公司：</span></div>' +
        '<div class="form-field"><input class="input f-company" maxlength="200" data-i18n="company_ph" value="' + E.esc(m.company) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="job">职务：</span></div>' +
        '<div class="form-field"><input class="input f-position" maxlength="100" data-i18n="job_ph" value="' + E.esc(m.position) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="inviter">邀请人：</span></div>' +
        '<div class="form-field"><input class="input f-inviter" maxlength="100" data-i18n="inviter_ph" value="' + E.esc(m.inviter) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="focus">关注方向：</span></div>' +
        '<div class="form-field"><input class="input f-focus" maxlength="200" data-i18n="focus_ph" value="' + E.esc(m.focus) + '"></div></div>' +
      '<div class="form-row"><div class="form-label"><span data-i18n="forum">论坛：</span></div>' +
        '<div class="form-field select-wrap"><select class="input f-session filled">' + sessOpts + '</select></div></div>' +
      '<div class="invited-tip hidden"></div>' +
    '</div>';
  }

  function render() {
    var box = document.getElementById("memberList");
    box.innerHTML = members.map(function (m, i) { return memberCardHtml(m, i); }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".member-card"), function (card, idx) {
      card.querySelector(".f-name").addEventListener("input", function () { members[idx].name = this.value; });
      card.querySelector(".f-phone").addEventListener("input", function () {
        if (idx === 0) { this.value = buyerPhone; E.toast(E.t("err_self_phone")); return; }
        members[idx].phone = this.value;
      });
      card.querySelector(".f-phone").addEventListener("change", function () { checkInvited(); });
      card.querySelector(".f-company").addEventListener("input", function () { members[idx].company = this.value; });
      card.querySelector(".f-position").addEventListener("input", function () { members[idx].position = this.value; });
      card.querySelector(".f-inviter").addEventListener("input", function () { members[idx].inviter = this.value; });
      card.querySelector(".f-focus").addEventListener("input", function () { members[idx].focus = this.value; });
      card.querySelector(".f-session").addEventListener("change", function () { members[idx].session_id = Number(this.value) || 0; });
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-remove]"), function (btn) {
      btn.addEventListener("click", function () {
        var mid = Number(btn.getAttribute("data-remove"));
        members = members.filter(function (m) { return m.id !== mid; });
        render();
      });
    });
    document.getElementById("btnAddMember").style.display = members.length >= MAX ? "none" : "";
    renderInvitedTips();
    E.applyLang();
  }

  /* 邀约名单：命中的人免审核、免票（提交时后端同样判定，这里是给用户即时反馈） */
  var invitedSet = {};
  function checkInvited() {
    var phones = members.map(function (x) { return x.phone; }).filter(function (p) { return /^1[3-9]\d{9}$/.test(p); });
    if (!phones.length) { renderInvitedTips(); return; }
    E.Api.checkInvited(phones, Number(eventId)).then(function (d) {
      invitedSet = (d && d.invited) || {};
      members.forEach(function (m) { m.is_invited = !!invitedSet[m.phone]; });
      renderInvitedTips();
    }).catch(function () { /* 查询失败不阻塞填写，后端提交时会再判一次 */ });
  }

  function renderInvitedTips() {
    var box = document.getElementById("memberList");
    Array.prototype.forEach.call(box.querySelectorAll(".member-card"), function (card, i) {
      var m = members[i];
      var tip = card.querySelector(".invited-tip");
      if (!tip) return;
      if (m && m.is_invited) {
        tip.textContent = E.t("invited_tip");
        tip.classList.remove("hidden");
        var tag = card.querySelector(".mc-tag");
        if (tag) tag.textContent = E.t("invited_tag");
      } else {
        tip.classList.add("hidden");
      }
    });
  }

  document.getElementById("btnAddMember").addEventListener("click", function () {
    if (members.length >= MAX) { E.toast(E.t("err_max_member")); return; }
    members.push({ id: ++seq, name: "", phone: "", company: "", position: "", inviter: members[0] ? members[0].inviter : "", focus: "", session_id: 0 });
    render();
  });

  /* ---------- 加载场次 ---------- */
  E.Api.event(eventId).then(function (ev) {
    var e = ev.event || ev;
    sessions = ev.sessions || e.sessions || [];
    members.push({ id: ++seq, name: (E.S.data && E.S.data.name) || "", phone: buyerPhone, company: (E.S.data && E.S.data.company) || "", position: (E.S.data && E.S.data.position) || "", inviter: "", focus: (E.S.data && E.S.data.focus) || "", session_id: 0 });
    render();
    checkInvited();
  }).catch(function (e) { E.errPill(e.message || "加载失败"); });

  /* ---------- 下一步：校验后进入门票类型页 ---------- */
  document.getElementById("btnSubmit").addEventListener("click", function () {
    E.errPill("");
    for (var i = 0; i < members.length; i++) {
      var m = members[i];
      if (!String(m.name).trim() || !String(m.company).trim() || !String(m.position).trim() || !String(m.inviter).trim()) {
        E.errPill(E.t("err_required")); return;
      }
      if (!/^1[3-9]\d{9}$/.test(String(m.phone))) { E.errPill(E.t("err_phone_bad")); return; }
    }
    var seen = {};
    for (var j = 0; j < members.length; j++) {
      if (seen[members[j].phone]) { E.errPill(E.t("err_dup_phone")); return; }
      seen[members[j].phone] = true;
    }
    // 暂存填报人，票种在 ticket.html 选择后统一提交
    E.S.patch({ draft_members: members });
    E.go("ticket.html", { event_id: eventId });
  });
})();
</script>
</body>
</html>
