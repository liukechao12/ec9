<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EC9</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="header"></div>

  <div class="sheet result-page">
    <div class="result-icon"><img id="resIcon" src="" alt=""></div>
    <div class="result-title" id="resTitle">—</div>
    <div class="result-sub hidden" id="resSub"></div>
    <button class="btn-primary" id="btnMain" data-i18n="back_home">回到首页</button>
    <button class="btn-primary hidden" id="btnSecond" style="background:#2A2A2C"></button>
    <div id="groupBox"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  var E = window.EC9;
  E.mountHeader(document.getElementById("header"), false);

  var eventId = E.param("event_id", E.DEFAULT_EVENT_ID);
  var type = E.param("type", "reg");       // reg | checkin
  var status = E.param("status", "pending");
  var regId = E.param("reg_id", "");
  var groupNo = E.param("group_no", "");

  // 报名结果
  var REG = {
    pending:     { icon: "earth_blue_review.png",   title: "result_pending",     sub: "" },
    rejected:    { icon: "earth_orange_reject.png", title: "result_rejected",    sub: "result_rejected_sub" },
    approved:    { icon: "earth_green_check.png",   title: "result_success",     sub: "" },
    pending_pay: { icon: "earth_blue_review.png",   title: "pending_pay_title",  sub: "pending_pay_sub" },
    paid:        { icon: "earth_green_check.png",   title: "st_booked",          sub: "" }
  };
  // 签到结果
  var CHK = {
    success:  { icon: "earth_green_signin.png",    title: "checkin_ok",       sub: "" },
    repeat:   { icon: "earth_blue_repeat.png",     title: "checkin_repeat",   sub: "" },
    mismatch: { icon: "earth_orange_mismatch.png", title: "checkin_mismatch", sub: "" },
    network:  { icon: "earth_pink_network.png",    title: "checkin_network",  sub: "" }
  };

  var map = type === "checkin" ? CHK : REG;
  var cfg = map[status] || (type === "checkin" ? CHK.success : REG.pending);

  document.getElementById("resIcon").src = "assets/" + cfg.icon;
  document.getElementById("resTitle").textContent = E.t(cfg.title);
  if (cfg.sub) {
    var sub = document.getElementById("resSub");
    sub.textContent = E.t(cfg.sub); sub.classList.remove("hidden");
  }

  var main = document.getElementById("btnMain");
  var second = document.getElementById("btnSecond");

  // btnMain 带着 data-i18n="back_home"，而 common.js 的 MutationObserver 一旦检测到
  // DOM 新增节点就会重跑 applyLang()，把所有 data-i18n 元素重置回字典值。
  // 于是「先填 groupBox → 触发监听 → 排期 applyLang」之后，setMain 刚写的文案
  // （如「查看电子票」）会被覆盖回「回到首页」，和第二个按钮重复。
  // 这两个按钮的文案由业务状态动态决定，不属于静态词条，所以要摘掉 data-i18n。
  // 切语言走 location.reload()，会重新走一遍流程，不受影响。
  function setMain(txt, fn) {
    main.removeAttribute("data-i18n");
    main.textContent = txt; main.addEventListener("click", fn);
  }
  function setSecond(txt, fn) {
    second.removeAttribute("data-i18n");
    second.textContent = txt; second.classList.remove("hidden"); second.addEventListener("click", fn);
  }

  /* ---------- 多人代报结果：按整单实时状态渲染 ---------- */
  function renderGroup(g) {
    var regs = g.registrations || [];
    var order = g.order;
    var curPayToken = payTokenParam || g.pay_token || "";
    var box = document.getElementById("groupBox");
    var anyRejected = regs.some(function (r) { return r.status === "rejected"; });
    var allPaid = regs.length && regs.every(function (r) { return r.status === "paid"; });
    var anyApproved = regs.some(function (r) { return r.status === "approved"; });
    // 「报名成功」= 不用掏钱的人（邀约免票 / ¥0 票种 / 订单已支付）：提交即成功，不用等审核
    var autoApproved = regs.length && regs.every(function (r) { return r.is_invited || !r.need_pay; })
      && (!order || Number(order.final_amount) === 0 || order.status === 'paid');

    var html = '<div class="group-tip ' + (allPaid ? 'ok' : (anyRejected ? 'warn' : 'info')) + '" style="margin-top:14px">';
    if (autoApproved) html = '<div class="group-tip ok" style="margin-top:14px">' + E.t("auto_approved_tip") + '</div>';
    if (allPaid) html += E.t("group_paid_ok");
    else if (anyRejected) {
      html += E.t("group_rejected_tip");
      var rj = regs.find(function (r) { return r.status === "rejected" && r.reject_reason; });
      if (rj) html += '<br>' + E.esc(rj.reject_reason);
      html += '<br>' + E.t("group_rejected_resub");
    } else if (anyApproved && order && order.status === 'pending_payment') html += E.t("group_approved_tip");
    else html += E.t("group_submitted_tip");
    html += '</div>';

    // 全员名单（购票数量与填报人数对得上：免票 F + 购票 M = N）
    var freeN = regs.filter(function (r) { return r.need_pay === false || Number(r.payable_price) === 0; }).length;
    var buyN = regs.length - freeN;
    html += '<div class="fee-box"><div class="fee-title">' + E.t("group_members_box") + '（' + regs.length +
      '）· ' + E.esc(E.t("tk_count_line").replace("{f}", freeN).replace("{m}", buyN)) + '</div>';
    regs.forEach(function (r) {
      var stTxt = r.status === 'paid' ? E.t("st_booked")
        : (r.status === 'approved' ? (r.need_pay === false ? E.t("result_success") : E.t("st_approved"))
          : (r.status === 'rejected' ? E.t("result_rejected") : E.t("result_pending")));
      html += '<div class="fee-row"><span>' + E.esc(r.name || '') +
        (r.is_invited ? '<span class="mc-tag">' + E.t(r.need_pay === false ? "invited_tag" : "invited_tag_pay") + '</span>' : '') +
        '<span class="mc-tag">' + E.esc(r.ticket_name || '') + ' ¥' + (r.payable_price != null ? Number(r.payable_price) : (r.is_student ? 0 : Number(r.price || 0))) + '</span></span>' +
        '<span>' + stTxt + '</span></div>';
    });
    if (order && !allPaid) {
      html += '<div class="fee-row"><span>' + E.t("total_row") + '</span><span>¥' + Number(order.final_amount).toFixed(2) +
        (order.discount_rate < 1 ? " " + E.discountText(order.discount_rate) : '') + '</span></div>';
    }
    html += '</div>';
    box.innerHTML = html;

    // 按钮
    if (allPaid) {
      // 设计稿「成功」页只有 1 个按钮：回到首页
      setMain(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
    } else if (anyRejected) {
      setMain(E.t("resubmit"), function () { E.go("profile.html", { event_id: eventId }); });
      setSecond(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
    } else if (anyApproved && order && order.status === "pending_payment") {
      setMain(E.t("pending_pay_btn"), function () {
        E.go("pending_pay.html", { event_id: eventId, group_no: groupNo, pay_token: curPayToken });
      });
      setSecond(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
    } else {
      setMain(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
    }
  }

  var payTokenParam = E.param("pay_token", "");

  function showStatus(st) {
    var c = REG[st] || REG.pending;
    document.getElementById("resIcon").src = "assets/" + c.icon;
    document.getElementById("resTitle").textContent = E.t(c.title);
    if (c.sub) {
      var sub = document.getElementById("resSub");
      sub.textContent = E.t(c.sub); sub.classList.remove("hidden");
    }
  }

  /* ---------- 单人（reg_id）：以服务端真实状态为准 ----------
     旧链接里的 status 只是提交那一刻的猜测值，后台审核通过后
     再打开会一直显示「等待审核」，所以一律实时查 mine 覆盖。 */
  function renderSingle(st, m) {
    var price = Number((m && m.price) || 0);
    var rid = regId || (m && m.registration_id) || "";

    // 审核通过 + 要掏钱 → 进「待付款」页（金额 + 支付按钮）
    if (st === "approved" && price > 0) {
      E.go("pending_pay.html", { event_id: eventId, reg_id: rid });
      return;
    }
    showStatus(st);
    if (st === "paid" || (st === "approved" && price === 0)) {
      // 已支付 / 免费票 → 报名成功，看电子票
      if (st === "approved") showStatus("approved");
      // 设计稿「成功」页只有 1 个按钮：回到首页
      setMain(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
    } else if (st === "rejected") {
      setMain(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
      setSecond(E.t("re_edit"), function () { E.go("profile.html", { event_id: eventId }); });
      if (m && m.reject_reason) {
        var sub = document.getElementById("resSub");
        sub.textContent = m.reject_reason; sub.classList.remove("hidden");
      }
    } else {
      setMain(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
    }
  }

  function loadSingleRealtime() {
    // 没凭证就只能按 URL 猜；有凭证一律查真实状态
    if (!E.S.token) { showStatus(status); renderSingle(status, null); return; }
    E.Api.mine(eventId).then(function (m) {
      if (!m || !m.registered) { showStatus(status); renderSingle(status, null); return; }
      // 属于某个整单 → 交给整单逻辑（人数、折扣、待付款都按整单口径）
      if (m.group && m.group.group_no) {
        E.go("result.html", { event_id: eventId, group_no: m.group.group_no, pay_token: payTokenParam });
        return;
      }
      showStatus(m.status);
      renderSingle(m.status, m);
    }).catch(function () { showStatus(status); renderSingle(status, null); });
  }

  if (groupNo) {
    E.Api.groupInfo(groupNo, payTokenParam).then(function (g) {
      // 以服务端真实状态覆盖 URL 里的 status 猜测
      var regs = g.registrations || [];
      var order = g.order;
      var anyRejected = regs.some(function (r) { return r.status === "rejected"; });
      var allPaid = regs.length && regs.every(function (r) { return r.status === "paid"; });
      var anyApproved = regs.some(function (r) { return r.status === "approved"; });
      var anyPending = regs.some(function (r) { return r.status === "submitted" || r.status === "pending_audit"; });
      // 整单一起审核：只要还有人在审核中，整单就还是「待审核」
      var st = allPaid ? "paid" : (anyRejected ? "rejected" : (anyPending ? "pending" : (anyApproved ? "approved" : "pending")));
      var c = REG[st] || REG.pending;

      // 审核通过（或邀约免审）但要掏钱 → 直接进「待付款」页：上面有付款金额和支付按钮
      var orderPending = order && order.status === "pending_payment";
      if (st === "approved" && orderPending) {
        E.go("pending_pay.html", {
          event_id: eventId, group_no: groupNo,
          pay_token: payTokenParam || g.pay_token || ""
        });
        return;
      }

      document.getElementById("resIcon").src = "assets/" + c.icon;
      document.getElementById("resTitle").textContent = E.t(c.title);
      renderGroup(g);
    }).catch(function (e) {
      E.toast(e.message || "");
      setMain(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
    });
  } else if (type === "checkin") {
    // 签到结果：设计稿「签到成功」页只有 1 个按钮：回到首页
    setMain(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
  } else if (regId) {
    loadSingleRealtime();
  } else {
    // 没有任何凭据：只能按 URL 显示
    showStatus(status === "paid" ? "paid" : (status === "rejected" ? "rejected" : "pending"));
    setMain(E.t("back_home"), function () { E.go("index.html", { event_id: eventId }); });
  }
})();
</script>
</body>
</html>
