<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title data-i18n="ticket_title">门票类型</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="tk-page">
  <div id="header"></div>

  <div class="tk-title" data-i18n="ticket_title">门票类型</div>

  <div class="tk-cards" id="tkCards"></div>

  <div class="tk-panel">
    <div class="tk-tabs">
      <div class="tk-tab active" data-tab="ben" data-i18n="tab_benefits">门票权益</div>
      <div class="tk-tab" data-tab="agenda" data-i18n="tab_agenda">论坛议程</div>
    </div>
    <div class="tk-cols" id="tkCols"></div>
    <div class="tk-agenda hidden" id="tkAgenda"></div>
  </div>

  <div class="tk-assign hidden" id="tkAssign">
    <div class="tk-assign-t" data-i18n="tk_assign_title">为每人选择票种</div>
    <div class="tk-assign-hint" data-i18n="tk_assign_hint">上方票卡可批量套用给所有人，下面可单独调整</div>
    <div id="tkAssignList"></div>
  </div>

  <div class="tk-fee" id="tkFee"></div>
  <div class="tk-student-tip hidden" id="tkStudentTip"></div>

  <div class="tk-agree-row">
    <span class="checkbox" id="agreeCk"></span>
    <span>
      <span data-i18n="agree_prefix">我已阅读并同意</span>
      <a href="agreement.html?tab=user&event_id=1" data-i18n="user_agreement">《用户协议》</a>
      <a href="agreement.html?tab=privacy&event_id=1" data-i18n="privacy_policy">《隐私政策》</a>
      <a href="agreement.html?tab=refund&event_id=1" data-i18n="refund_policy_doc">《退款政策》</a>
    </span>
  </div>

  <button class="btn-primary tk-submit" id="btnSubmit" data-i18n="tk_submit">提交</button>
  <div class="refund-note" data-i18n="tk_refund"></div>
  <div class="error-pill hidden" id="errPill"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  var E = window.EC9;
  // 论坛议程新稿（卡片式）在此渲染；语言切换走 reload，字典按当前语言取词
  document.getElementById("tkAgenda").innerHTML = E.agendaHtml();
  // 门票页底色是浅灰（无蓝色品牌条），但语言切换入口必须有：
  // 这里挂 header 后在 CSS 里隐藏 .brand、只留右上角的切换浮层并改成深色。
  E.mountHeader(document.getElementById("header"), false);
  var eventId = E.param("event_id", E.DEFAULT_EVENT_ID);
  var tickets = [];
  // 旧草稿（session_all 还没这个字段时存的）里 session_id=0 只可能是「全部论坛」：
  // 论坛是必填项，未选根本过不了上一页的校验，直接补上，别让老草稿退化成「未选」
  var members = ((E.S.data && E.S.data.draft_members) || []).map(function (m) {
    if (m.session_all === undefined && !Number(m.session_id)) m.session_all = true;
    // 老草稿只有单选结果，补成数组，别让多选改造把它们清空
    if (!Array.isArray(m.session_ids) || !m.session_ids.length) {
      m.session_ids = Number(m.session_id) > 0 ? [Number(m.session_id)] : [];
    }
    return m;
  });
  var selectedId = 0;          // 默认票种：点上方票卡会批量套用给所有人
  var perTicket = [];          // 每人票种，下标与 members 对齐
  var agreed = false;

  if (!E.S.token || !E.S.phone) { E.go("signup.html", { event_id: eventId }); return; }

  // 协议链接带上来源（从协议页返回回到选票现场）
  var selfUrl = location.pathname.split("/").pop() + location.search;
  Array.prototype.forEach.call(document.querySelectorAll('a[href^="agreement.html"]'), function (a) {
    var base = a.getAttribute("href");
    a.setAttribute("href", base + (base.indexOf("?") > -1 ? "&" : "?") + "redirect=" + encodeURIComponent(selfUrl));
  });

  /* 勾选框只有 12px，手机上很难点中；把点击热区扩到整行（协议链接除外，照常跳转） */
  var agreeCk = document.getElementById("agreeCk");
  agreeCk.parentElement.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("a")) return;
    agreed = agreeCk.classList.toggle("checked");
  });

  /* ---------- 工具 ---------- */
  function ticketById(id) {
    for (var i = 0; i < tickets.length; i++) if (tickets[i].id === Number(id)) return tickets[i];
    return null;
  }
  function priceText(tk) {
    return Number(tk.price) === 0 ? E.t("tk_free") : String(Math.round(Number(tk.price)));
  }
  function benefitsOf(tk) {
    var n = String(tk.name || "");
    if (/尊享|VIP|Premium/i.test(n)) return E.t("ben_vip").split("\n");
    if (/学生|Student/i.test(n)) return E.t("ben_student").split("\n");
    return E.t("ben_std").split("\n");
  }
  function barClass(i) { return "tk-bar g" + (i + 1); }

  /* ---------- 票卡 ---------- */
  function cardHtml(tk, i) {
    var free = Number(tk.price) === 0;
    return '<div class="tk-card" data-tid="' + tk.id + '">' +
      '<div class="tk-main">' +
        '<div class="tk-tline">' +
          '<div class="tk-date">' + E.esc(E.t("year")) + '<br>' + E.esc(E.t("date_short")) + '</div>' +
          '<div class="tk-tickets">' + E.esc(E.t("tickets")) + '</div>' +
        '</div>' +
        '<img class="tk-photo" src="img/tk_photo.png" alt="">' +
        '<div class="tk-bl">' +
          '<div class="tk-city">' + E.esc(E.t("city")) + '</div>' +
          '<div class="tk-venue">' + E.esc(E.t("venue")) + '</div>' +
        '</div>' +
        '<div class="tk-br">' + E.esc(E.t("slogan1")) + '<br>' + E.esc(E.t("slogan2")) + '</div>' +
      '</div>' +
      '<div class="tk-perf"></div>' +
      '<div class="tk-stub">' +
        '<div class="tk-s-top">TICKETS</div>' +
        '<div class="tk-s-name">' + E.esc(tk.name) + '</div>' +
        '<div class="tk-s-cur' + (free ? " free" : "") + '">' + (free ? "FREE" : "¥") + '</div>' +
        '<div class="tk-s-val' + (free ? " free" : "") + '">' +
          (free ? E.esc(E.t("tk_free")) : E.esc(priceText(tk))) + '</div>' +
      '</div>' +
      '<div class="' + barClass(i) + '"></div>' +
    '</div>';
  }

  function renderCards() {
    var box = document.getElementById("tkCards");
    box.innerHTML = tickets.map(cardHtml).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".tk-card"), function (el) {
      el.addEventListener("click", function () { select(Number(el.getAttribute("data-tid"))); });
    });
  }

  /* ---------- 权益面板 ---------- */
  function renderCols() {
    var box = document.getElementById("tkCols");
    box.innerHTML = tickets.map(function (tk) {
      // 设计稿权益表首行是票面价格，价格来自接口，不写死
      var price = Number(tk.price) === 0 ? E.t("tk_free") : priceText(tk) + " " + E.t("tk_unit");
      var lis = '<li class="tk-p">' + E.esc(price) + '</li>' +
        benefitsOf(tk).map(function (b) { return '<li>' + E.esc(b) + '</li>'; }).join("");
      return '<div class="tk-col" data-cid="' + tk.id + '">' +
        '<div class="tk-col-h">' + E.esc(tk.name) + '</div>' +
        '<ul class="tk-ben">' + lis + '</ul>' +
      '</div>';
    }).join("");
    alignBenRows();
  }

  /* 三列权益表按行对齐：英文条目会折成两行，行高不一致时三列就错位了。
     做法是按行取三列的最大高度，统一设成 min-height。 */
  function alignBenRows() {
    var cols = Array.prototype.slice.call(document.querySelectorAll(".tk-col"));
    if (cols.length < 2) return;
    var rows = Math.min.apply(null, cols.map(function (c) {
      return c.querySelectorAll(".tk-ben li").length;
    }));
    for (var i = 0; i < rows; i++) {
      var lis = cols.map(function (c) { return c.querySelectorAll(".tk-ben li")[i]; });
      var max = 0;
      lis.forEach(function (li) { li.style.minHeight = ""; });
      lis.forEach(function (li) { max = Math.max(max, li.getBoundingClientRect().height); });
      lis.forEach(function (li) { li.style.minHeight = max + "px"; });
    }
  }

  /* ---------- 按人分配票种 ---------- */
  function renderAssign() {
    var box = document.getElementById("tkAssign");
    // 原本只有「票种 ≥2」才显示分配区；但只要有人选了学生票就必须显示（要上传学籍报告）
    var needReport = members.some(function (m, i) { return isStudentTicket(perTicket[i] || selectedId); });
    if (!members.length || (tickets.length < 2 && !needReport)) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    var list = document.getElementById("tkAssignList");
    list.innerHTML = members.map(function (m, i) {
      var nm = String(m.name || "").trim() || String(m.phone || "");
      var btns = tickets.map(function (tk) {
        // 这个人被赠的票：按钮上直接标「免费」，一眼看出选它不用花钱
        var gift = Number(m.gift_ticket_id) > 0 && Number(m.gift_ticket_id) === Number(tk.id);
        return '<span class="tk-a-btn' + (perTicket[i] === tk.id ? " on" : "") +
          '" data-i="' + i + '" data-tid="' + tk.id + '">' + E.esc(tk.name) +
          (gift ? '<span class="tk-a-free">' + E.esc(E.t("gift_tag")) + '</span>' : '') + '</span>';
      }).join("");
      // 学生票：多出《教育部学籍在线验证报告》上传（报名时必传，主办方按在线验证码人工复核）
      var isStu = isStudentTicket(perTicket[i]);
      var rf = m.reportFile;
      var reportBox = isStu
        ? '<div class="tk-a-report">' +
            '<label class="tk-report-pick" data-i="' + i + '">' +
              '<input type="file" class="tk-report-input" data-i="' + i + '" ' +
                'accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">' +
              '<span class="tk-report-btn">' + E.esc(E.t("student_report_btn")) + '</span>' +
            '</label>' +
            (rf ? '<div class="tk-report-file">✓ ' + E.esc(E.t("student_report_chosen")) + '：' + E.esc(rf.name) + '</div>' : '') +
            '<div class="tk-a-tip">' + E.esc(E.t("student_report_tip")) + '</div>' +
            '<div class="tk-a-tip tk-report-how">' + E.esc(E.t("student_report_how")) + '</div>' +
          '</div>'
        : '';
      var tkNow = ticketById(perTicket[i] || selectedId);
      var tagNow = (Number(m.gift_ticket_id) > 0 && Number(m.gift_ticket_id) === Number(tkNow && tkNow.id))
        ? E.t("gift_tag")                                   // 正好选到赠票
        : (isFreeFor(m, tkNow) ? E.t("invited_std_tag") : "");   // ¥0 票种 / 特批免票
      return '<div class="tk-a-row">' +
        '<div class="tk-a-name">' + E.esc(nm) + (tagNow ? '<span class="tk-a-free">' + E.esc(tagNow) + '</span>' : '') + '</div>' +
        '<div class="tk-a-btns">' + btns + '</div>' +
        reportBox +
      '</div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".tk-a-btn"), function (el) {
      el.addEventListener("click", function () {
        perTicket[Number(el.getAttribute("data-i"))] = Number(el.getAttribute("data-tid"));
        renderAssign(); renderFee();
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll(".tk-report-input"), function (el) {
      el.addEventListener("change", function () {
        var i = Number(el.getAttribute("data-i"));
        var f = el.files && el.files[0];
        if (!f) return;
        // File 只存在内存里的 members 上，不写 localStorage（无法序列化）
        members[i].reportFile = f;
        renderAssign();   // 重绘显示已选文件名
      });
    });
  }

  /** 该票种是不是学生票：先看后台属性 is_student，老数据没这个字段才按名称兜底 */
  function isStudentTicket(tid) {
    var tk = ticketById(tid);
    if (!tk) return false;
    if (tk.is_student !== undefined && tk.is_student !== null && String(tk.is_student) !== "") {
      return Number(tk.is_student) === 1;
    }
    return /学生|學生|student/i.test(String(tk.name || ""));
  }

  /** 校验没过时把页面滚到那一位的报告上传控件，别让用户自己找 */
  function btnScrollToId(i) {
    var el = document.querySelector('.tk-report-pick[data-i="' + i + '"]');
    if (el) { try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {} }
  }

  function select(id) {
    selectedId = id;
    // 点票卡 = 批量套用给所有人；要单独调整用下面的按人分配区
    perTicket = members.map(function () { return id; });
    Array.prototype.forEach.call(document.querySelectorAll(".tk-card"), function (el) {
      el.classList.toggle("selected", Number(el.getAttribute("data-tid")) === id);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".tk-col"), function (el) {
      el.classList.toggle("active", Number(el.getAttribute("data-cid")) === id);
    });
    var tk = ticketById(id);
    var tip = document.getElementById("tkStudentTip");
    var anyStudent = members.some(function (m, i) {
      return isStudentTicket(perTicket[i] || id);
    });
    if (anyStudent) {
      tip.textContent = E.t("student_tip"); tip.classList.remove("hidden");
    } else { tip.classList.add("hidden"); }
    renderAssign();
    renderFee();
  }

  /* ---------- 费用（口径同后端：邀约免票/¥0票种不计入付费票；折扣只认标准票） ----------
     只有标准票计入张数门槛，也只有标准票打折；尊享票等非标准票一律原价。
     总价 = 标准票金额×折扣 + 其它票种原价。档位在后台「折扣规则」配置，不写死在前端。 */
  /* 免费判定（口径同后端 groupOrderService.isFreeFor）：
     ① 票种本身 ¥0（学生票/免费票）              → 免费
     ② 邀约管理给这个人指定了票种，且他选的就是那张 → 免费（赠票）
     ③ 管理员特批 need_pay=0                     → 免费 */
  function isFreeFor(m, tk) {
    if (!tk) return false;
    if (!(Number(tk.price) > 0)) return true;
    if (!m) return false;
    if (Number(m.gift_ticket_id) > 0 && Number(m.gift_ticket_id) === Number(tk.id)) return true;
    if (m.need_pay === false || Number(m.need_pay) === 0) return true;
    return false;
  }
  // 兼容老调用点（不看票种时的粗判：有赠票或特邀免票）
  function isFreeOf(m) { return !!(m && (Number(m.gift_ticket_id) > 0 || (m.is_invited && m.need_pay !== true))); }
  // 判定以票种属性 is_standard 为准（后台可勾），名称匹配只在属性缺失的老数据上兜底
  var STD_RE = /标准|標準|standard/i;
  function isStd(t) {
    if (!t || Number(t.is_student) === 1) return false;
    if (t.is_standard !== undefined && t.is_standard !== null && String(t.is_standard) !== '') return Number(t.is_standard) === 1;
    return STD_RE.test(String(t.name || ""));
  }

  /* ---------- 折扣档位（后台「折扣规则」页配置，随票种接口一起下发） ----------
     这儿必须和后端 services/discountRules.js 用同一套口径，否则页面显示的优惠
     和真正扣的钱对不上：
       ① 张数只数「付费的标准票」；
       ② 命中取就高（min_qty <= 张数 里最大的那档）；
       ③ 没有配档位时才用内置默认，配了就完全听后台的。 */
  var discountRules = [];
  // 仅当后台一条都没配时的兜底，和后端 DEFAULT_TIERS 保持一致
  var DEFAULT_DR = [{ min_qty: 5, rate: 0.8, enabled: 1 }, { min_qty: 3, rate: 0.9, enabled: 1 }];

  /** 付费标准票张数 → 折扣率（1 = 不打折） */
  function tierRate(stdN) {
    var rules = (discountRules && discountRules.length) ? discountRules : DEFAULT_DR;
    var hit = null;
    rules.forEach(function (r) {
      if (r && r.enabled !== undefined && r.enabled !== null && Number(r.enabled) !== 1) return;
      var mq = Number(r && r.min_qty), ra = Number(r && r.rate);
      if (!isFinite(mq) || !isFinite(ra) || ra <= 0 || ra > 1) return;
      if (stdN >= mq && (!hit || mq > hit.min_qty)) hit = { min_qty: mq, rate: ra };
    });
    return hit ? hit.rate : 1.0;
  }

  function renderFee() {
    var box = document.getElementById("tkFee");
    if (!members.length) { box.innerHTML = ""; return; }

    // 每人按自己选的票种计价：票种 ¥0（学生票）或命中邀约 → 该人不计费
    var sub = [];   // [{tid, name, n, amt}]
    var buyN = 0, raw = 0, stdN = 0, stdAmt = 0, otherAmt = 0;
    members.forEach(function (m, i) {
      var tk = ticketById(perTicket[i] || selectedId);
      if (!tk) return;
      var unit = Number(tk.price) || 0;
      if (isFreeFor(m, tk)) return;
      buyN++; raw += unit;
      if (isStd(tk)) { stdN++; stdAmt += unit; } else { otherAmt += unit; }
      var row = null;
      sub.forEach(function (s) { if (s.tid === tk.id) row = s; });
      if (!row) { row = { tid: tk.id, name: tk.name, n: 0, amt: 0, std: isStd(tk) }; sub.push(row); }
      row.n++; row.amt += unit;
    });
    var freeN = members.length - buyN;
    // 折扣只吃付费标准票，档位来自后台配置（同后端 services/discountRules.js）
    var rate = tierRate(stdN);
    var total = Math.round((stdAmt * rate + otherAmt) * 100) / 100;

    var html = '<div>' + E.esc(E.t("tk_buy_line")
      .replace("{n}", members.length).replace("{f}", freeN).replace("{m}", buyN)) + '</div>';

    if (sub.length === 1) {
      // 单一票种：沿用原来的整句，读起来更顺
      html += '<div>' + E.esc(E.t("tk_fee_line")
        .replace("{n}", buyN).replace("{ticket}", sub[0].name).replace("{amt}", total.toFixed(2))) +
        (rate < 1 ? " " + E.discountText(rate) : "") + '</div>';
    } else if (sub.length > 1) {
      // 混合票种：逐票种列小计（标准票这行已是折后，其它票种原价），再给合计
      var CheckedTotal = 0;
      sub.forEach(function (s) {
        var lineAmt = s.std ? Math.round(s.amt * rate * 100) / 100 : s.amt;
        CheckedTotal = Math.round((CheckedTotal + lineAmt) * 100) / 100;
        html += '<div>' + E.esc(E.t("tk_item_line")
          .replace("{ticket}", s.name).replace("{n}", s.n).replace("{amt}", lineAmt.toFixed(2))) +
          (rate < 1 && s.std ? " " + E.discountText(rate) : "") + '</div>';
      });
      total = CheckedTotal;   // 逐行取整后再合计，避免分行显示与合计对不上
      html += '<div class="tk-fee-total">' + E.esc(E.t("tk_total_line").replace("{amt}", total.toFixed(2))) + '</div>';
    }

    // 免票 / 购票 分别是哪些人，便于核对人数
    var freeNames = [], buyNames = [];
    members.forEach(function (m, i) {
      var tk = ticketById(perTicket[i] || selectedId);
      var nm = String(m.name || "").trim() || String(m.phone || "");
      if (!tk || isFreeFor(m, tk)) {
        // 标签区分原因：选到赠票标「赠票·免费」，¥0 票种/admin 特批免票标原「邀约·标准票」
        var tag = (Number(m.gift_ticket_id) > 0 && Number(m.gift_ticket_id) === Number(tk && tk.id))
          ? E.t("gift_tag") : (isFreeOf(m) ? E.t("invited_std_tag") : "");
        freeNames.push(nm + tag);
      } else buyNames.push(nm);
    });
    if (freeNames.length) html += '<div style="margin-top:4px">' + E.esc(E.t("free_ticket_count").replace("{n}", freeNames.length)) + '：' + E.esc(freeNames.join("、")) + '</div>';
    if (buyNames.length) html += '<div style="margin-top:4px">' + E.esc(E.t("paid_ticket_count").replace("{n}", buyNames.length)) + '：' + E.esc(buyNames.join("、")) + '</div>';

    box.innerHTML = html;
  }

  /* ---------- tab ---------- */
  Array.prototype.forEach.call(document.querySelectorAll(".tk-tab"), function (el) {
    el.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".tk-tab"), function (x) { x.classList.remove("active"); });
      el.classList.add("active");
      var ben = el.getAttribute("data-tab") === "ben";
      document.getElementById("tkCols").classList.toggle("hidden", !ben);
      document.getElementById("tkAgenda").classList.toggle("hidden", ben);
    });
  });

  /* ---------- 加载 ---------- */
  Promise.all([E.Api.event(eventId), E.Api.tickets(eventId)]).then(function (res) {
    var list = res[1].ticket_types || res[1].list || res[1] || [];
    discountRules = res[1].discount_rules || [];
    tickets = list.filter(function (t) { return t.on_shelf === undefined || t.on_shelf == 1; });
    tickets.sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    if (!tickets.length) { E.errPill(E.t("err_ticket_load")); return; }
    renderCards(); renderCols();
    var def = tickets.filter(function (t) { return Number(t.price) > 0; })[0] || tickets[0];
    select(def.id);
    // 被赠票的人默认帮他选中那张赠票（选它免费）；没赠票的人维持默认票种
    members.forEach(function (m, i) {
      if (Number(m.gift_ticket_id) > 0 && ticketById(m.gift_ticket_id)) {
        perTicket[i] = Number(m.gift_ticket_id);
      }
    });
    renderAssign(); renderFee();
    E.applyLang();
  }).catch(function (e) { E.errPill(e.message || E.t("err_ticket_load")); });

  /* ---------- 提交 ---------- */
  document.getElementById("btnSubmit").addEventListener("click", function () {
    E.errPill("");
    if (!members.length) { E.errPill(E.t("err_required")); E.go("profile.html", { event_id: eventId }); return; }
    if (!selectedId || members.some(function (m, i) { return !perTicket[i]; })) { E.toast(E.t("ticket_title")); return; }
    if (!agreed) { E.toast(E.t("agree_required_tip")); return; }
    // 学生票：提交前先在本地拦一道（报告必传 / 格式 / 大小），别让用户白等一趟接口
    for (var k = 0; k < members.length; k++) {
      if (!isStudentTicket(perTicket[k] || selectedId)) continue;
      var rf = members[k].reportFile;
      if (!rf) { E.toast(E.t("err_student_report_required")); btnScrollToId(k); return; }
      var ext = String(rf.name || "").toLowerCase().split(".").pop();
      if (!/^(pdf|jpg|jpeg|png)$/.test(ext)) { E.toast(E.t("err_student_report_type")); btnScrollToId(k); return; }
      if (rf.size > 10 * 1024 * 1024) { E.toast(E.t("err_student_report_size")); btnScrollToId(k); return; }
    }
    var btn = this; btn.disabled = true;
    var payloadMembers = members.map(function (m, i) {
      return {
        name: String(m.name || "").trim(), phone: m.phone, is_invited: !!m.is_invited,
        company: String(m.company || "").trim(), position: String(m.position || "").trim(),
        inviter: String(m.inviter || "").trim(), focus: String(m.focus || "").trim(),
        // 论坛是**多选**：session_ids 是所选全部；session_all=1 表示全选
        session_ids: (Array.isArray(m.session_ids) && m.session_ids.length)
          ? m.session_ids.map(Number).filter(function (x) { return x > 0; })
          : (Number(m.session_id) > 0 ? [Number(m.session_id)] : []),
        session_all: m.session_all ? 1 : 0,
        // session_id 只剩兼容回退（写所选第一个），后端以 session_ids + session_all 为准
        session_id: (function () {
          var ids = (Array.isArray(m.session_ids) && m.session_ids.length) ? m.session_ids : [];
          return Number(ids[0] || m.session_id) || 0;
        })(),
        ticket_type_id: Number(perTicket[i] || selectedId)
      };
    });
    // 有学生票 → multipart 带报告文件；没有学生票 → 保持原来的 JSON 提交（老流程零改动）
    var hasStu = payloadMembers.some(function (o) { return isStudentTicket(o.ticket_type_id); });
    var body;
    if (hasStu) {
      var fd = new FormData();
      fd.append("event_id", String(Number(eventId)));
      fd.append("buyer_phone", E.S.phone);
      fd.append("members", JSON.stringify(payloadMembers));
      members.forEach(function (m, i) {
        if (isStudentTicket(payloadMembers[i].ticket_type_id) && m.reportFile) {
          fd.append("report_" + i, m.reportFile, m.reportFile.name);
        }
      });
      body = fd;
    } else {
      body = { event_id: Number(eventId), buyer_phone: E.S.phone, members: payloadMembers };
    }
    E.Api.submitGroup(body).then(function (d) {
      E.S.patch({ group_no: d.group_no, quote: d.quote, draft_members: null });
      E.go("result.html", { event_id: eventId, group_no: d.group_no, status: "pending" });
    }).catch(function (e) {
      btn.disabled = false;
      E.errPill(e.message || E.t("err_submit"));
    });
  });
})();
</script>
</body>
</html>
