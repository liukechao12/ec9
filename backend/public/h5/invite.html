<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title data-i18n="h5.invite.title">活动邀约报名</title>
    <link rel="stylesheet" href="/h5/style.css">
</head>
<body>
    <div class="container">
        <!-- 加载状态 -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p data-i18n="h5.common.loading">加载中...</p>
        </div>

        <!-- 错误提示 -->
        <div id="error" class="error-message" style="display: none;">
            <div class="error-icon">⚠️</div>
            <h2 data-i18n="h5.common.error">出错了</h2>
            <p id="error-text"></p>
            <button class="btn-primary" onclick="location.reload()" data-i18n="h5.common.reload">重新加载</button>
        </div>

        <!-- 邀约信息页面 -->
        <div id="invite-page" class="page" style="display: none;">
            <div class="header">
                <h1 id="event-name" data-i18n="h5.common.eventName">活动名称</h1>
                <p class="subtitle" data-i18n="h5.invite.welcome">欢迎参加本次活动</p>
            </div>

            <div class="content">
                <div class="info-card">
                    <div class="info-item">
                        <span class="label" data-i18n="h5.invite.eventTime">活动时间</span>
                        <span class="value" id="event-time">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label" data-i18n="h5.invite.eventLocation">活动地点</span>
                        <span class="value" id="event-location">-</span>
                    </div>
                </div>

                <div class="form-section">
                    <h2 data-i18n="h5.invite.enterPhone">请输入您的手机号</h2>
                    <div class="input-group">
                        <input 
                            type="tel" 
                            id="phone-input" 
                            class="input" 
                            placeholder="请输入11位手机号"
                            maxlength="11"
                            pattern="[0-9]{11}"
                        >
                        <div class="input-error" id="phone-error" style="display: none;"></div>
                    </div>
                    <button id="verify-btn" class="btn-primary btn-block" disabled data-i18n="h5.invite.verifyPhone">验证手机号</button>
                </div>

                <!-- 嘉宾信息展示（验证成功后显示） -->
                <div id="guest-info" class="guest-info-card" style="display: none;">
                    <h3 data-i18n="h5.invite.yourInfo">您的信息</h3>
                    <div class="info-item">
                        <span class="label" data-i18n="h5.common.name">姓名</span>
                        <span class="value" id="guest-name">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label" data-i18n="h5.common.company">公司</span>
                        <span class="value" id="guest-company">-</span>
                    </div>
                    <button id="confirm-btn" class="btn-primary btn-block" data-i18n="h5.invite.confirm">确认报名</button>
                </div>
            </div>
        </div>

        <!-- 门票页面 -->
        <div id="ticket-page" class="page" style="display: none;">
            <div class="header">
                <h1 data-i18n="h5.invite.success">报名成功</h1>
                <p class="subtitle" data-i18n="h5.invite.ticketReady">您的门票已生成</p>
            </div>

            <div class="content">
                <div class="ticket-card">
                    <div class="ticket-header">
                        <h2 id="ticket-event-name" data-i18n="h5.common.eventName">活动名称</h2>
                    </div>
                    <div class="ticket-body">
                        <div class="ticket-info">
                            <div class="info-item">
                                <span class="label" data-i18n="h5.common.name">姓名</span>
                                <span class="value" id="ticket-guest-name">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label" data-i18n="h5.common.company">公司</span>
                                <span class="value" id="ticket-guest-company">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label" data-i18n="h5.invite.ticketNo">门票编号</span>
                                <span class="value ticket-code" id="ticket-code">-</span>
                            </div>
                        </div>
                        <div class="qr-code-container">
                            <div class="qr-code-label" data-i18n="h5.invite.qrTitle">入场二维码</div>
                            <div id="qr-code" class="qr-code">
                                <img id="qr-code-img" src="" alt="二维码">
                            </div>
                            <p class="qr-tip" data-i18n="h5.invite.qrTip">请截图保存此二维码，入场时出示</p>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-secondary btn-block" onclick="saveTicket()" data-i18n="h5.invite.save">保存门票</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/i18n.js?v=20261015.1"></script>
    <script src="/h5/invite.js"></script>
</body>
</html>
