<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>2025业绩说明会 - 报名登记</title>
    <base href="/">
    <link rel="stylesheet" href="/h5/performance.css">
</head>
<body>
    <!-- 页面1: 首页 -->
    <div id="page-home" class="perf-page active">
        <div class="perf-bg-wrap">
            <img src="/h5/images/20260312180807_218_651.jpg" class="perf-bg-img" alt="">
        </div>
        <div class="perf-home-inner">
            <div class="perf-header">
                <h2 class="perf-title" data-i18n="h5.perf.title2025">2025业绩说明会</h2>
                <p class="perf-subtitle" data-i18n="h5.perf.register">报名登记</p>
            </div>
            <div class="perf-content">
                <button class="perf-btn-primary" id="btnRegister" data-i18n="h5.common.registerNow">立即报名</button>
            </div>
            <div class="perf-legal-footer">
                <a href="/api/legal/user-agreement" target="_blank" class="perf-legal-link" data-i18n="h5.legal.agreement">用户协议</a>
                <a href="/api/legal/privacy-policy" target="_blank" class="perf-legal-link" data-i18n="h5.legal.privacy">隐私政策</a>
            </div>
        </div>
    </div>

    <!-- 页面2: 手机验证 -->
    <div id="page-verify" class="perf-page">
        <div class="perf-bg-wrap">
            <img src="/h5/images/20260312180807_218_651.jpg" class="perf-bg-img" alt="">
        </div>
        <div class="perf-page-inner">
            <div class="perf-header">
                <h2 class="perf-title" data-i18n="h5.perf.title2025">2025业绩说明会</h2>
                <p class="perf-subtitle" data-i18n="h5.common.phoneVerify">手机验证</p>
            </div>
            <div class="perf-form-card">
                <label class="perf-label">手机号 <span class="required">*</span></label>
                <input type="tel" class="perf-input" id="inputPhoneVerify" placeholder="请输入11位手机号" maxlength="11">
                <div class="perf-code-row">
                    <input type="text" class="perf-input perf-input-code" id="inputCode" placeholder="请输入验证码" maxlength="6">
                    <button type="button" class="perf-btn-code" id="btnGetCode" data-i18n="h5.common.getCode">获取验证码</button>
                </div>
                <div class="perf-error" id="verifyError" style="display:none;"></div>
                <button class="perf-btn-primary" id="btnVerify" data-i18n="h5.common.next">下一步</button>
            </div>
        </div>
    </div>

    <!-- 页面3: 信息填写 -->
    <div id="page-form" class="perf-page">
        <div class="perf-bg-wrap">
            <img src="/h5/images/20260312180807_218_651.jpg" class="perf-bg-img" alt="">
        </div>
        <div class="perf-page-inner">
        <div class="perf-header">
            <h2 class="perf-title" data-i18n="h5.perf.title2025">2025业绩说明会</h2>
            <p class="perf-subtitle" data-i18n="h5.common.regInfo">报名信息</p>
        </div>
        <div class="perf-form-card">
            <label class="perf-label">姓名 <span class="required">*</span></label>
            <input type="text" class="perf-input" id="inputName" placeholder="请输入姓名">
            <label class="perf-label">联系电话 <span class="required">*</span></label>
            <input type="tel" class="perf-input" id="inputPhoneForm" placeholder="请输入11位手机号" maxlength="11">
            <label class="perf-label">单位名称 <span class="required">*</span></label>
            <input type="text" class="perf-input" id="inputCompany" placeholder="请输入单位名称">
            <label class="perf-label">职位 <span class="required">*</span></label>
            <input type="text" class="perf-input" id="inputPosition" placeholder="请输入职位">
            <button class="perf-btn-primary" id="btnSubmit" data-i18n="h5.perf.submit">提交报名</button>
            <div class="perf-error" id="formError" style="display:none;"></div>
        </div>
        </div>
    </div>

    <!-- 页面4: 待审核 -->
    <div id="page-pending" class="perf-page">
        <div class="perf-bg-wrap">
            <img src="/h5/images/20260312180807_218_651.jpg" class="perf-bg-img" alt="">
        </div>
        <div class="perf-page-inner">
            <div class="perf-result">
                <div class="perf-result-icon perf-result-pending">⏳</div>
                <h2 class="perf-result-title" data-i18n="h5.perf.submitted">已提交，等待审核</h2>
                <p class="perf-result-desc">您的报名信息已提交，管理员审核通过后将短信通知您。</p>
            </div>
        </div>
    </div>

    <!-- 页面5: 报名成功 -->
    <div id="page-success" class="perf-page">
        <div class="perf-bg-wrap">
            <img src="/h5/images/20260312180807_218_651.jpg" class="perf-bg-img" alt="">
        </div>
        <div class="perf-page-inner">
        <div class="perf-result">
            <div class="perf-result-icon">✓</div>
            <h2 class="perf-result-title" data-i18n="h5.invite.success">报名成功</h2>
            <p class="perf-result-desc" data-i18n="h5.perf.thanks">感谢您的报名，期待与您相见！</p>
        </div>
        </div>
    </div>

    <script src="/i18n.js?v=20261015.1"></script>
    <script src="/h5/performance.js"></script>
</body>
</html>
